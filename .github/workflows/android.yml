# KS_ANDROID_STAFF_v1 - the Android staff app (phones and tablets; the portal plus its "Phone" dialler icon).
#
#   verify   every pull request and push to main: builds a debug APK (kept as a run artifact for sideloading).
#   release  Actions > "Android staff app" > Run workflow: builds the signed release bundle (AAB).
#   upload   after release: sends the bundle to Google Play (internal track by default). Skipped with a notice,
#            never failed, when GOOGLE_PLAY_SERVICE_ACCOUNT_JSON or the signing key is missing.
#
# Licensee empty = the Keystone app (one Play listing for every brokerage; staff find their company by work email or
# mobile number, like the iPad app). A licensee code = that brokerage's own app, branded from its GitHub environment
# ks-<code> (variables VITE_API_BASE_URL, VITE_COMPANY_NAME, optional ANDROID_APPLICATION_ID, ANDROID_BRAND_COLOR,
# ANDROID_ICON_URL or DESKTOP_ICON_URL), published from the licensee's own Play account with its own secrets.
#
# Secrets (repository for the Keystone app, or the licensee's environment):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   upload key
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON                                                             Play upload
#   GOOGLE_SERVICES_JSON (raw or base64)                                                         Firebase: push + calls
name: Android staff app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      licensee:
        description: 'Licensee code for its own branded app (empty = the Keystone app)'
        required: false
        default: ''
      play_track:
        description: Google Play track
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      play_status:
        description: 'Release status ("draft" until the app has passed its first Play review)'
        type: choice
        default: draft
        options: [draft, completed]

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}-${{ inputs.licensee || 'keystone' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3
      - run: npm ci --include=optional
      - name: Brand file is the Keystone default
        run: node scripts/android-brand.mjs --check
      - run: npm run build
        env:
          VITE_KS_OPS_URL: ${{ vars.VITE_KS_OPS_URL || 'https://ks-ops-dev.azurewebsites.net' }}
      - run: npx cap sync android
      - name: Firebase file (placeholder on pull requests)
        run: node scripts/android-google-services.mjs
      - name: Build the debug APK
        run: gradle assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-staff-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.licensee && format('ks-{0}', inputs.licensee) || '' }}
    outputs:
      application_id: ${{ steps.brand.outputs.application_id }}
      app_name: ${{ steps.brand.outputs.app_name }}
      signed: ${{ steps.sign.outputs.signed }}
    env:
      LICENSEE: ${{ inputs.licensee }}
      ANDROID_LICENSEE: ${{ inputs.licensee }}
      VITE_COMPANY_NAME: ${{ inputs.licensee && vars.VITE_COMPANY_NAME || '' }}
      ANDROID_APPLICATION_ID: ${{ inputs.licensee && vars.ANDROID_APPLICATION_ID || '' }}
      ANDROID_BRAND_COLOR: ${{ inputs.licensee && (vars.ANDROID_BRAND_COLOR || vars.VITE_PRIMARY_COLOR) || '' }}
      ICON_URL: ${{ inputs.licensee && (vars.ANDROID_ICON_URL || vars.DESKTOP_ICON_URL) || '' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v6
      - name: Licensee is in the registry
        if: env.LICENSEE != ''
        run: node deploy/licensee-matrix.mjs portal "$LICENSEE" > /dev/null
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3
      - run: npm ci --include=optional
      - name: Brand (application id, names, colours)
        id: brand
        run: node scripts/android-brand.mjs
      - name: Licensee icon
        if: env.ICON_URL != ''
        run: |
          case "$ICON_URL" in https://*) ;; *) echo "::error::ANDROID_ICON_URL must be an https address"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/icon"
          curl -fsSL --max-filesize 5000000 "$ICON_URL" -o "$RUNNER_TEMP/icon/icon.png"
          python3 -m pip install --quiet pillow
          python3 scripts/android-icons.py "$RUNNER_TEMP/icon/icon.png"
      - name: Web build settings
        env:
          API_URL: ${{ inputs.licensee && vars.VITE_API_BASE_URL || '' }}
          OPS_URL: ${{ vars.VITE_KS_OPS_URL || 'https://ks-ops-dev.azurewebsites.net' }}
        run: |
          {
            echo "VITE_KS_OPS_URL=$OPS_URL"
            if [ -n "$LICENSEE" ]; then
              case "$API_URL" in https://*) ;; *) echo "::error::Add the variable VITE_API_BASE_URL (https) to the environment ks-$LICENSEE"; exit 1 ;; esac
              echo "VITE_API_URL=$API_URL"
              echo "VITE_API_BASE_URL=$API_URL"
              echo "VITE_KS_FIXED_SERVER=true"
              [ -z "$VITE_COMPANY_NAME" ] || echo "VITE_COMPANY_NAME=$VITE_COMPANY_NAME"
            fi
          } >> .env.production.local
      - run: npm run build
      - run: npx cap sync android
      - name: Firebase file
        run: node scripts/android-google-services.mjs
      - name: Upload key
        id: sign
        run: |
          missing=""
          for v in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android signing::Missing secrets:${missing/KEYSTORE_BASE64/ANDROID_KEYSTORE_BASE64} - building an unsigned bundle (not uploadable to Google Play)."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build the release bundle (AAB)
        run: gradle bundleRelease
        working-directory: android
      - name: Check the signature
        if: steps.sign.outputs.signed == 'true'
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab > /dev/null
      - name: Name the bundle
        run: cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/android-staff-${LICENSEE:-keystone}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-staff-aab
          path: ${{ runner.temp }}/android-staff-${{ inputs.licensee || 'keystone' }}.aab
          retention-days: 30
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Summary
        run: |
          {
            echo "### Android staff app - ${{ steps.brand.outputs.app_name }}"
            echo "- Application id: ${{ steps.brand.outputs.application_id }}"
            echo "- Version code: $((1000 + GITHUB_RUN_NUMBER))"
            echo "- Signed: ${{ steps.sign.outputs.signed }}"
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    needs: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.licensee && format('ks-{0}', inputs.licensee) || '' }}
    env:
      PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Google Play credentials
        id: creds
        run: |
          if [ "${{ needs.release.outputs.signed }}" != "true" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Google Play::The bundle is unsigned (no upload key) - not uploaded."
          elif [ -z "$PLAY_JSON" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Google Play::No GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret - not uploaded. The bundle is kept as the run artifact android-staff-aab."
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.upload == 'true'
        with:
          name: android-staff-aab
          path: aab
      - name: Upload to Google Play
        if: steps.creds.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: ${{ needs.release.outputs.application_id }}
          releaseFiles: aab/*.aab
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
      - name: Summary
        run: |
          echo "- Google Play (${{ inputs.play_track }}, ${{ inputs.play_status }}): uploaded=${{ steps.creds.outputs.upload }}" >> "$GITHUB_STEP_SUMMARY"
